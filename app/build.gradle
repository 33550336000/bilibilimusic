plugins {
    id 'com.android.application'
}

ext {
    targetApkDir = file("./")
    targetApkName = "缇宝.apk"
}

android {
    namespace = "com.tilixibiesi"
    compileSdk = 30

    defaultConfig {
        applicationId = "com.tilixibiesi"
        minSdk = 30
        targetSdk = 30
        versionCode = 13
        versionName = "33550336"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
        }
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig = false
        resValues = false
        shaders = false
    }

    packaging {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/LICENSE*'
        exclude 'META-INF/NOTICE*'
    }
    packagingOptions {
        dex {
            useLegacyPackaging = true
        }
    }
signingConfigs {
    release {
        storeFile = file("${rootDir}/yuanshen.keystore")
        storePassword = providers.gradleProperty('signing.password').get()
        keyAlias = providers.gradleProperty('signing.alias').get()
        keyPassword = providers.gradleProperty('signing.password').get()
    }
}

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            zipAlignEnabled = true
            debuggable = false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}

dependencies {
}

project.afterEvaluate {
    def assembleTask = tasks.findByName('assembleRelease')
    if (assembleTask) {
        def apkSource = project.file("build/outputs/apk/release/app-release.apk")
        def destDir = project.ext.targetApkDir
        if (!destDir.exists()) {
            destDir.mkdirs()
        }
        def destFileName = project.ext.targetApkName

        assembleTask.doLast {
            if (apkSource.exists()) {
                java.nio.file.Files.copy(
                    apkSource.toPath(),
                    new File(destDir, destFileName).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                println "\033[32mAPK 已复制到: ${destDir.absolutePath}/${destFileName}"
            } else {
                println "\033[30未找到 APK 文件: ${apkSource.absolutePath}任务失败。"
            }
        }
    }
}
